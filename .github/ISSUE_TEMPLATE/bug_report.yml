name: Bug report / 问题报告
description: Report a reproducible application or file compatibility problem
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。涉及工程文件时，请不要上传机密、受限或包含敏感信息的数据。
  - type: input
    id: version
    attributes:
      label: Spatial Viewer version / 版本
      placeholder: version, tag, or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows environment / 系统环境
      placeholder: Windows version, architecture, GPU if relevant
    validations:
      required: true
  - type: input
    id: file_format
    attributes:
      label: File format and source / 文件格式与来源
      description: Include format/version and the application/version that created or exported the file when known.
      placeholder: e.g. DXF ..., exported by ...
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / 复现步骤
      placeholder: Tell us the smallest reliable way to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际结果
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context / 补充信息
      description: Screenshots, sanitized logs, entity/layer/CRS/font/material details, or a link to a legally shareable minimal sample.
  - type: checkboxes
    id: privacy
    attributes:
      label: Data check / 数据确认
      options:
        - label: I have removed private, confidential, or restricted project information from anything I am sharing.
          required: true
