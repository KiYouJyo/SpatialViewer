name: Windows CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

concurrency:
  group: spatialviewer-windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore SpatialViewer.sln
      - run: dotnet build SpatialViewer.sln -c Debug --no-restore
      - run: dotnet build SpatialViewer.sln -c Release --no-restore
      - run: dotnet test SpatialViewer.sln -c Release --no-build --verbosity normal
