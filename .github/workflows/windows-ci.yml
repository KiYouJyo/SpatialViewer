name: Windows CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

concurrency:
  group: spatialviewer-windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify trilingual localization contract
        shell: pwsh
        run: ./packaging/Test-LocalizationCompleteness.ps1
      - name: Verify application update contract
        shell: pwsh
        run: ./packaging/Test-AppUpdateContract.ps1
      - run: dotnet restore SpatialViewer.sln -p:Configuration=Release -p:Platform=x64
      - run: dotnet build SpatialViewer.sln -c Debug -p:Platform=x64 --no-restore
      - run: dotnet build SpatialViewer.sln -c Release -p:Platform=x64 --no-restore
      - run: dotnet test SpatialViewer.sln -c Release -p:Platform=x64 --no-build --verbosity normal
