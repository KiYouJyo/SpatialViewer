name: SpatialViewer v0.3.3 r2 Acceptance Package

on:
  push:
    branches: ['codex/v0.3.3-r2-acceptance']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spatialviewer-v033-r2-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify source and tests
        shell: pwsh
        run: |
          ./packaging/Test-LocalizationCompleteness.ps1
          ./packaging/Test-AppUpdateContract.ps1
          dotnet restore SpatialViewer.sln -p:Configuration=Release -p:Platform=x64
          dotnet test SpatialViewer.sln -c Release -p:Platform=x64 --no-restore

      - name: Prepare acceptance-only package revision
        shell: pwsh
        run: |
          $manifestPath = 'src/SpatialViewer.App/Package.appxmanifest'
          [xml]$manifest = Get-Content -LiteralPath $manifestPath -Raw
          if ($manifest.Package.Identity.Version -cne '0.3.3.0') { throw "Unexpected source package version: $($manifest.Package.Identity.Version)" }
          if ($manifest.Package.Identity.Publisher -cne 'CN=AppPublisher') { throw "Unexpected publisher: $($manifest.Package.Identity.Publisher)" }
          $manifest.Package.Identity.Version = '0.3.3.2'
          $manifest.Save((Resolve-Path -LiteralPath $manifestPath))
          [xml]$verify = Get-Content -LiteralPath $manifestPath -Raw
          if ($verify.Package.Identity.Version -cne '0.3.3.2') { throw 'Acceptance package revision patch failed.' }
          Write-Host 'Display/product version remains 0.3.3; acceptance-only MSIX revision is 0.3.3.2.'

      - name: Resolve latest integrated CadCore
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $payload = Join-Path $env:RUNNER_TEMP 'SpatialViewer-LatestIntegratedCadCore'
          $resolved = @(./packaging/Resolve-LatestIntegratedCadCore.ps1 -OutputDirectory $payload) | Select-Object -Last 1
          if (-not $resolved -or [string]::IsNullOrWhiteSpace([string]$resolved.version)) { throw 'Latest integrated CadCore resolution failed.' }
          "CADCORE_PAYLOAD=$payload" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CADCORE_VERSION=$($resolved.version)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CADCORE_ABI=$($resolved.abiVersion)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CADCORE_COMMIT=$($resolved.commit)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Acceptance package will embed SpatialViewer.CadCore v$($resolved.version), ABI $($resolved.abiVersion)."

      - name: Build and rewrite unsigned x64 bundle
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'SpatialViewer-AppPackages'
          dotnet build src/SpatialViewer.App/SpatialViewer.App.csproj -c Release -p:Platform=x64 -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false -p:AppxBundle=Always -p:AppxBundlePlatforms=x64 -p:UapAppxPackageBuildMode=SideloadOnly -p:AppxPackageDir="$output\"
          if ($LASTEXITCODE -ne 0) { throw "MSIX build failed: $LASTEXITCODE" }
          $bundle = @(Get-ChildItem $output -Recurse -Filter '*.msixbundle') | Select-Object -First 1
          if (-not $bundle) { throw 'MSIXBundle was not produced.' }
          $assets = Join-Path $env:RUNNER_TEMP 'SpatialViewer-v033-r2-acceptance'
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          $finalBundle = Join-Path $assets 'SpatialViewer_0.3.3.2_x64.msixbundle'
          Copy-Item -LiteralPath $bundle.FullName -Destination $finalBundle -Force
          ./packaging/Rewrite-CadCoreMsixBundleLayout.ps1 -BundlePath $finalBundle -BundledVersion $env:CADCORE_VERSION -PayloadDirectory $env:CADCORE_PAYLOAD
          if ($LASTEXITCODE -ne 0) { throw "CadCore MSIX layout rewrite failed: $LASTEXITCODE" }
          "ASSETS_DIRECTORY=$assets" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BUNDLE_PATH=$finalBundle" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify package identity and integrated CadCore
        shell: pwsh
        run: |
          $makeappx = Get-ChildItem (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin') -Recurse -Filter makeappx.exe | Where-Object FullName -match '\\x64\\makeappx.exe$' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { throw 'x64 makeappx.exe was not found.' }
          $unbundle = Join-Path $env:RUNNER_TEMP 'v033-r2-unbundle'
          $unpack = Join-Path $env:RUNNER_TEMP 'v033-r2-unpack'
          Remove-Item $unbundle,$unpack -Recurse -Force -ErrorAction SilentlyContinue
          & $makeappx.FullName unbundle /p $env:BUNDLE_PATH /d $unbundle /o | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "makeappx unbundle failed: $LASTEXITCODE" }
          $inner = @(Get-ChildItem $unbundle -Filter '*.msix' -File) | Select-Object -First 1
          if (-not $inner) { throw 'Inner x64 MSIX was not found.' }
          & $makeappx.FullName unpack /p $inner.FullName /d $unpack /o | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "makeappx unpack failed: $LASTEXITCODE" }
          [xml]$manifest = Get-Content (Join-Path $unpack 'AppxManifest.xml') -Raw
          if ($manifest.Package.Identity.Name -cne 'SpatialViewer' -or $manifest.Package.Identity.Publisher -cne 'CN=AppPublisher' -or $manifest.Package.Identity.Version -cne '0.3.3.2') { throw 'Acceptance MSIX identity mismatch.' }
          foreach ($name in @('SpatialViewer.Core.dll','SpatialViewer.Rendering.dll','SpatialViewer.Rendering.Windows.dll','SpatialViewer.Formats.Cad.dll','SpatialViewer.Formats.Cad.ACadSharp.dll')) {
            if (Test-Path -LiteralPath (Join-Path $unpack $name) -PathType Leaf) { throw "CadCore isolation failed; root copy remains: $name" }
            $source = Join-Path $env:CADCORE_PAYLOAD $name
            $bundled = Join-Path $unpack "Kernels\Bundled\$env:CADCORE_VERSION\$name"
            if (-not (Test-Path -LiteralPath $bundled -PathType Leaf)) { throw "Bundled CadCore payload missing: $name" }
            if ((Get-FileHash $source -Algorithm SHA256).Hash -cne (Get-FileHash $bundled -Algorithm SHA256).Hash) { throw "Bundled CadCore payload hash mismatch: $name" }
          }
          Write-Host "Acceptance identity + CadCore verification PASS: package 0.3.3.2 / CadCore v$env:CADCORE_VERSION."

      - name: Sign acceptance bundle and export public certificate
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.GH_RELEASE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.GH_RELEASE_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:CERTIFICATE_PASSWORD)) { throw 'GitHub release signing secrets are not configured.' }
          $pfx = Join-Path $env:RUNNER_TEMP 'spatialviewer-v033-r2-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if ($certificate.Subject -cne 'CN=AppPublisher' -or -not $certificate.HasPrivateKey) { throw "Unexpected signing certificate: $($certificate.Subject)" }
          $cer = Join-Path $env:ASSETS_DIRECTORY 'SpatialViewer-v0.3.3-Framework-Dependent.cer'
          Export-Certificate -Cert $certificate -FilePath $cer | Out-Null
          $signtool = Get-ChildItem (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin') -Recurse -Filter signtool.exe | Where-Object FullName -match '\\x64\\signtool.exe$' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'x64 signtool.exe was not found.' }
          & $signtool.FullName sign /fd SHA256 /sha1 $certificate.Thumbprint /tr http://timestamp.digicert.com /td SHA256 $env:BUNDLE_PATH
          if ($LASTEXITCODE -ne 0) { throw "signtool failed: $LASTEXITCODE" }
          $signature = Get-AuthenticodeSignature -FilePath $env:BUNDLE_PATH
          if (-not $signature.SignerCertificate -or $signature.SignerCertificate.Subject -cne 'CN=AppPublisher' -or $signature.SignerCertificate.Thumbprint -cne $certificate.Thumbprint) { throw 'Signed acceptance bundle identity mismatch.' }
          if ($signature.Status -notin @('Valid','UnknownError')) { throw "Unexpected Authenticode status: $($signature.Status)" }
          "CERTIFICATE_PATH=$cer" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Write acceptance evidence and checksums
        shell: pwsh
        run: |
          $bundleHash = (Get-FileHash -LiteralPath $env:BUNDLE_PATH -Algorithm SHA256).Hash.ToLowerInvariant()
          "$bundleHash  SpatialViewer_0.3.3.2_x64.msixbundle" | Set-Content -LiteralPath (Join-Path $env:ASSETS_DIRECTORY 'SHA256SUMS.txt') -Encoding ascii
          Copy-Item -LiteralPath (Join-Path $env:CADCORE_PAYLOAD 'cadcore-resolution.json') -Destination (Join-Path $env:ASSETS_DIRECTORY 'cadcore-resolution.json') -Force
          @(
            'SpatialViewer v0.3.3 acceptance revision 2',
            "Source commit: $env:GITHUB_SHA",
            'Display/product version: 0.3.3',
            'Acceptance MSIX package version: 0.3.3.2',
            "Bundled CadCore: v$env:CADCORE_VERSION",
            "CadCore ABI: $env:CADCORE_ABI",
            "CadCore commit: $env:CADCORE_COMMIT",
            "Bundle SHA256: $bundleHash",
            'Purpose: remove middle-click close + real Mica document hover window + no shell-tab hover + persistent shell-tab page identity',
            'Formal GitHub release: not created by this workflow'
          ) | Set-Content -LiteralPath (Join-Path $env:ASSETS_DIRECTORY 'ACCEPTANCE.txt') -Encoding utf8

      - name: Upload signed acceptance assets
        uses: actions/upload-artifact@v4
        with:
          name: SpatialViewer-v0.3.3-r2-signed-acceptance
          path: |
            ${{ env.ASSETS_DIRECTORY }}/SpatialViewer_0.3.3.2_x64.msixbundle
            ${{ env.ASSETS_DIRECTORY }}/SpatialViewer-v0.3.3-Framework-Dependent.cer
            ${{ env.ASSETS_DIRECTORY }}/SHA256SUMS.txt
            ${{ env.ASSETS_DIRECTORY }}/cadcore-resolution.json
            ${{ env.ASSETS_DIRECTORY }}/ACCEPTANCE.txt
          if-no-files-found: error
