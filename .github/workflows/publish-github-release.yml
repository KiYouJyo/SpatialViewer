name: Publish GitHub Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'release/release.json'
  workflow_dispatch:
    inputs:
      version:
        description: Three-part release version, for example 0.1.0
        required: true
        type: string
      dry_run:
        description: Build, sign, and validate without creating a GitHub Release
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: spatialviewer-github-release-${{ github.ref_name || inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'
          }
          elseif ('${{ github.ref }}'.StartsWith('refs/tags/')) {
            $version = '${{ github.ref_name }}'.Substring(1)
          }
          else {
            $metadata = Get-Content release/release.json -Raw | ConvertFrom-Json
            $version = [string]$metadata.product.version
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid release version: $version" }
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_version=$version.0" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "source_ref=refs/tags/v$version" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "dry_run=${{ inputs.dry_run || 'false' }}" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Ensure immutable release tag for main release metadata push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v${{ steps.version.outputs.version }}'
          git fetch --tags --force
          $existing = git rev-list -n 1 "refs/tags/$tag" 2>$null
          if (-not [string]::IsNullOrWhiteSpace($existing)) {
            Write-Host "$tag already exists at $existing; reusing it as the immutable release source."
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a $tag -m "Spatial Viewer $tag"
          git push origin "refs/tags/$tag"

      - name: Checkout immutable release source
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: pwsh
        run: |
          git fetch --tags --force
          git checkout --force '${{ steps.version.outputs.source_ref }}'
          git submodule update --init --recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate source metadata
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          $release = Get-Content release/release.json -Raw | ConvertFrom-Json
          if (-not $release.channels.github.publish -or $release.product.version -ne $env:RELEASE_VERSION -or $release.product.packageVersion -ne $env:PACKAGE_VERSION) { throw 'Release metadata does not match the requested GitHub version.' }
          [xml]$project = Get-Content src/SpatialViewer.App/SpatialViewer.App.csproj -Raw
          [xml]$manifest = Get-Content src/SpatialViewer.App/Package.appxmanifest -Raw
          $projectVersion = @($project.Project.PropertyGroup | ForEach-Object Version | Where-Object { $_ })[0]
          if ($projectVersion -ne $env:RELEASE_VERSION -or $manifest.Package.Identity.Version -ne $env:PACKAGE_VERSION -or $manifest.Package.Identity.Publisher -ne 'CN=AppPublisher') { throw 'Project or package manifest version/identity mismatch.' }
          if ((git rev-list -n 1 "refs/tags/v$env:RELEASE_VERSION") -ne (git rev-parse HEAD)) { throw 'Checked out source does not match the immutable release tag.' }

      - name: Validate signing secrets
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.GH_RELEASE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.GH_RELEASE_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:CERTIFICATE_PASSWORD)) { throw 'GitHub release signing secrets are not configured.' }

      - name: Restore and test
        shell: pwsh
        run: |
          dotnet restore SpatialViewer.sln -p:Configuration=Release -p:Platform=x64
          dotnet test SpatialViewer.sln -c Release -p:Platform=x64 --no-restore

      - name: Resolve latest integrated CadCore
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $payload = Join-Path $env:RUNNER_TEMP 'SpatialViewer-LatestIntegratedCadCore'
          $resolved = @(./packaging/Resolve-LatestIntegratedCadCore.ps1 -OutputDirectory $payload) | Select-Object -Last 1
          if (-not $resolved -or [string]::IsNullOrWhiteSpace([string]$resolved.version)) { throw 'Latest integrated CadCore resolution failed.' }
          "CADCORE_PAYLOAD=$payload" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CADCORE_VERSION=$($resolved.version)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CADCORE_ABI=$($resolved.abiVersion)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CADCORE_COMMIT=$($resolved.commit)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CADCORE_RELEASE_URL=$($resolved.releaseUrl)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Release will embed SpatialViewer.CadCore v$($resolved.version) from $($resolved.releaseUrl)."

      - name: Build and rewrite unsigned x64 MSIX bundle
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'SpatialViewer-AppPackages'
          dotnet build src/SpatialViewer.App/SpatialViewer.App.csproj -c Release -p:Platform=x64 -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false -p:AppxBundle=Always -p:AppxBundlePlatforms=x64 -p:UapAppxPackageBuildMode=SideloadOnly -p:AppxPackageDir="$output\"
          $bundle = @(Get-ChildItem $output -Recurse -Filter '*.msixbundle') | Select-Object -First 1
          if (-not $bundle) { throw 'MSIXBundle was not produced.' }
          $assets = Join-Path $env:RUNNER_TEMP 'SpatialViewer-ReleaseAssets'
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          $bundleName = "SpatialViewer_${{ steps.version.outputs.package_version }}_x64.msixbundle"
          $finalBundle = Join-Path $assets $bundleName
          Copy-Item -LiteralPath $bundle.FullName -Destination $finalBundle -Force
          ./packaging/Rewrite-CadCoreMsixBundleLayout.ps1 -BundlePath $finalBundle -BundledVersion $env:CADCORE_VERSION -PayloadDirectory $env:CADCORE_PAYLOAD
          if ($LASTEXITCODE -ne 0) { throw "Cad Core MSIX layout rewrite failed: $LASTEXITCODE" }
          "BUNDLE_PATH=$finalBundle" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BUNDLE_NAME=$bundleName" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ASSETS_DIRECTORY=$assets" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify bundled latest integrated CadCore
        shell: pwsh
        run: |
          $makeappx = Get-ChildItem (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin') -Recurse -Filter makeappx.exe | Where-Object FullName -match '\\x64\\makeappx.exe$' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { throw 'x64 makeappx.exe was not found.' }
          $unbundle = Join-Path $env:RUNNER_TEMP 'SpatialViewer-release-unbundle'
          $unpack = Join-Path $env:RUNNER_TEMP 'SpatialViewer-release-unpack'
          Remove-Item $unbundle, $unpack -Recurse -Force -ErrorAction SilentlyContinue
          & $makeappx.FullName unbundle /p $env:BUNDLE_PATH /d $unbundle /o | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "makeappx unbundle failed: $LASTEXITCODE" }
          $inner = @(Get-ChildItem $unbundle -Filter '*.msix' -File) | Select-Object -First 1
          if (-not $inner) { throw 'Inner x64 MSIX was not found.' }
          & $makeappx.FullName unpack /p $inner.FullName /d $unpack /o | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "makeappx unpack failed: $LASTEXITCODE" }
          foreach ($name in @('SpatialViewer.Core.dll','SpatialViewer.Rendering.dll','SpatialViewer.Rendering.Windows.dll','SpatialViewer.Formats.Cad.dll','SpatialViewer.Formats.Cad.ACadSharp.dll')) {
            if (Test-Path -LiteralPath (Join-Path $unpack $name) -PathType Leaf) { throw "CadCore resolver isolation failed; root copy still packaged: $name" }
            $source = Join-Path $env:CADCORE_PAYLOAD $name
            $bundled = Join-Path $unpack "Kernels\Bundled\$env:CADCORE_VERSION\$name"
            if (-not (Test-Path -LiteralPath $bundled -PathType Leaf)) { throw "Bundled latest CadCore payload missing: $bundled" }
            if ((Get-FileHash $source -Algorithm SHA256).Hash -cne (Get-FileHash $bundled -Algorithm SHA256).Hash) { throw "Bundled CadCore payload differs from resolved latest release: $name" }
          }
          Write-Host "Bundled latest integrated CadCore verification PASS: v$env:CADCORE_VERSION ABI $env:CADCORE_ABI."

      - name: Sign bundle and export public certificate
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.GH_RELEASE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.GH_RELEASE_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'spatialviewer-release-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if ($certificate.Subject -cne 'CN=AppPublisher' -or -not $certificate.HasPrivateKey) { throw "Unexpected release certificate: $($certificate.Subject)" }
          $cer = Join-Path $env:ASSETS_DIRECTORY "SpatialViewer-v${{ steps.version.outputs.version }}-Framework-Dependent.cer"
          Export-Certificate -Cert $certificate -FilePath $cer | Out-Null
          $signtool = Get-ChildItem (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin') -Recurse -Filter signtool.exe | Where-Object FullName -match '\\x64\\signtool.exe$' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'x64 signtool.exe was not found.' }
          & $signtool.FullName sign /fd SHA256 /sha1 $certificate.Thumbprint /tr http://timestamp.digicert.com /td SHA256 $env:BUNDLE_PATH
          if ($LASTEXITCODE -ne 0) { throw "signtool failed: $LASTEXITCODE" }
          $signature = Get-AuthenticodeSignature -FilePath $env:BUNDLE_PATH
          if (-not $signature.SignerCertificate -or $signature.SignerCertificate.Subject -cne 'CN=AppPublisher' -or $signature.SignerCertificate.Thumbprint -cne $certificate.Thumbprint) { throw 'Signed bundle identity mismatch.' }
          if ($signature.Status -notin @('Valid', 'UnknownError')) { throw "Unexpected Authenticode status: $($signature.Status)" }
          "CERTIFICATE_PATH=$cer" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create and validate one-click installer
        shell: pwsh
        run: |
          $staging = Join-Path $env:ASSETS_DIRECTORY 'staging'
          ./packaging/New-GitHubOneClickInstallerPackage.ps1 -SignedBundlePath $env:BUNDLE_PATH -PublicCertificatePath $env:CERTIFICATE_PATH -OutputDirectory $staging -DisplayVersion '${{ steps.version.outputs.version }}' -PackageVersion '${{ steps.version.outputs.package_version }}'
          $root = Join-Path $staging "SpatialViewer-v${{ steps.version.outputs.version }}-x64-one-click"
          ./packaging/Test-GitHubOneClickInstallerPackage.ps1 -ReleaseDirectory $root
          $zip = Join-Path $env:ASSETS_DIRECTORY "SpatialViewer-v${{ steps.version.outputs.version }}-x64-one-click.zip"
          Compress-Archive -LiteralPath $root -DestinationPath $zip -CompressionLevel Optimal
          $extracted = Join-Path $env:ASSETS_DIRECTORY 'extracted'
          Expand-Archive -LiteralPath $zip -DestinationPath $extracted -Force
          ./packaging/Test-GitHubOneClickInstallerPackage.ps1 -ReleaseDirectory (Join-Path $extracted "SpatialViewer-v${{ steps.version.outputs.version }}-x64-one-click") -ZipPath $zip

      - name: Create checksum manifest and release body
        shell: pwsh
        run: |
          $files = @((Join-Path $env:ASSETS_DIRECTORY "SpatialViewer-v${{ steps.version.outputs.version }}-x64-one-click.zip"), $env:BUNDLE_PATH)
          $lines = foreach ($file in $files) { "{0}  {1}" -f (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant(), (Split-Path -Leaf $file) }
          Set-Content -LiteralPath (Join-Path $env:ASSETS_DIRECTORY 'SHA256SUMS.txt') -Value $lines -Encoding ascii

          $version = '${{ steps.version.outputs.version }}'
          $noteFiles = @(
            "docs/RELEASE-NOTES-v$version.md",
            "docs/RELEASE-NOTES-v$version.ja.md",
            "docs/RELEASE-NOTES-v$version.en.md"
          )
          $hydratedFromMain = $false
          foreach ($noteFile in $noteFiles) {
            if (-not (Test-Path -LiteralPath $noteFile -PathType Leaf)) {
              $content = git show "origin/main:$noteFile"
              if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace(($content -join "`n"))) { throw "Missing release notes in both release tag and main: $noteFile" }
              $directory = Split-Path -Parent $noteFile
              if ($directory) { New-Item -ItemType Directory -Force -Path $directory | Out-Null }
              [IO.File]::WriteAllText([IO.Path]::GetFullPath($noteFile), ($content -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
              $hydratedFromMain = $true
            }
          }

          $bodyPath = Join-Path $env:RUNNER_TEMP 'release-body.md'
          ./packaging/New-GitHubReleaseBody.ps1 -Version $version -OutputPath $bodyPath
          if ($hydratedFromMain) {
            $body = [IO.File]::ReadAllText($bodyPath, [Text.Encoding]::UTF8)
            $body = $body.Replace("/blob/v$version/", '/blob/main/')
            [IO.File]::WriteAllText($bodyPath, $body, [Text.UTF8Encoding]::new($false))
          }
          $kernelLine = '- SpatialViewer.CadCore v{0}（ABI {1}，commit `{2}`）' -f $env:CADCORE_VERSION, $env:CADCORE_ABI, $env:CADCORE_COMMIT
          Add-Content -LiteralPath $bodyPath -Value @('', '### 随包内核', $kernelLine, '- 发布包始终解析并嵌入已完成应用接入的最新稳定内核版本。') -Encoding utf8

      - name: Publish and verify GitHub Release
        if: steps.version.outputs.dry_run != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v${{ steps.version.outputs.version }}'
          $expected = @($env:BUNDLE_NAME, "SpatialViewer-v${{ steps.version.outputs.version }}-x64-one-click.zip", 'SHA256SUMS.txt')
          if (gh release view $tag 2>$null) { throw "GitHub Release already exists: $tag" }
          gh release create $tag --verify-tag --title "Spatial Viewer $tag" --notes-file (Join-Path $env:RUNNER_TEMP 'release-body.md') 2>$null
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed.' }
          foreach ($name in $expected) { gh release upload $tag (Join-Path $env:ASSETS_DIRECTORY $name); if ($LASTEXITCODE -ne 0) { throw "Asset upload failed: $name" } }
          $release = gh api "repos/${{ github.repository }}/releases/tags/$tag" | ConvertFrom-Json
          if ($release.draft -or $release.prerelease -or $release.tag_name -ne $tag -or @($release.assets).Count -ne 3) { throw 'Published release metadata or asset count mismatch.' }
          foreach ($name in $expected) { if (@($release.assets | Where-Object name -eq $name).Count -ne 1) { throw "Published asset missing: $name" } }

      - name: Upload release assets for traceability
        uses: actions/upload-artifact@v4
        with:
          name: SpatialViewer-${{ steps.version.outputs.version }}-github-release-assets
          path: |
            ${{ env.ASSETS_DIRECTORY }}/SpatialViewer-v${{ steps.version.outputs.version }}-x64-one-click.zip
            ${{ env.ASSETS_DIRECTORY }}/*.msixbundle
            ${{ env.ASSETS_DIRECTORY }}/SHA256SUMS.txt
            ${{ env.CADCORE_PAYLOAD }}/cadcore-resolution.json
          if-no-files-found: error
