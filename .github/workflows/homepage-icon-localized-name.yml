name: Apply homepage icon and localized product names

on:
  push:
    branches: [codex/homepage-icon-localized-name]
    paths:
      - '.github/workflows/homepage-icon-localized-name.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/homepage-icon-localized-name
          fetch-depth: 0
      - name: Patch homepage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/assets
          cp src/SpatialViewer.App/Assets/Square150x150Logo.png docs/assets/app-icon.png
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
            '<meta name="description" content="Spatial Viewer — 面向 CAD、GIS、BIM/IFC 与 Rhino 数据的现代 Windows 看图器。">': '<meta name="description" content="图览（Spatial Viewer）— 面向 CAD、GIS、BIM/IFC 与 Rhino 数据的现代 Windows 看图器。">',
            '<title>Spatial Viewer · 图览</title>': '<title>图览 · Spatial Viewer</title>',
            '.brand-mark{width:30px;height:30px;border-radius:9px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;box-shadow:inset 0 0 0 1px rgba(255,255,255,.34),0 1px 3px rgba(0,0,0,.10);background:#fff}.brand-mark i:nth-child(1){background:#649fc3}.brand-mark i:nth-child(2){background:#87b7a5}.brand-mark i:nth-child(3){background:#8aa6c5}.brand-mark i:nth-child(4){background:#d99684}': '.brand-mark{width:30px;height:30px;border-radius:9px;display:block;object-fit:contain;box-shadow:0 1px 3px rgba(0,0,0,.10)}',
            '.brand span:last-child{display:none}': '.brand .brand-name{display:none}',
            '<a class="brand" href="./" aria-label="Spatial Viewer home"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>Spatial Viewer</span></a>': '<a class="brand" href="./" aria-label="Spatial Viewer home"><img class="brand-mark" src="assets/app-icon.png" alt=""><span class="brand-name l zh">图览</span><span class="brand-name l ja">図覧</span><span class="brand-name l en">Spatial Viewer</span></a>',
            '<h1>Spatial Viewer</h1>': '<h1><span class="l zh">图览</span><span class="l ja">図覧</span><span class="l en">Spatial Viewer</span></h1>',
            '<p class="l zh">Spatial Viewer 当前统一通过 GitHub Releases 发布，不再区分 Preview / Stable 产品通道。</p>': '<p class="l zh">图览当前统一通过 GitHub Releases 发布，不再区分 Preview / Stable 产品通道。</p>',
            '<p class="l ja">Spatial Viewer は現在 GitHub Releases を単一の公開チャネルとして使用しています。</p>': '<p class="l ja">図覧は現在 GitHub Releases を単一の公開チャネルとして使用しています。</p>',
            '<h3 id="release-version">Spatial Viewer v0.3.7</h3>': '<h3><span class="l zh">图览</span><span class="l ja">図覧</span><span class="l en">Spatial Viewer</span> <span id="release-version">v0.3.7</span></h3>',
            '<footer><div class="shell footer-grid"><span>Spatial Viewer · 图览 · 図覧</span>': '<footer><div class="shell footer-grid"><span><span class="l zh">图览</span><span class="l ja">図覧</span><span class="l en">Spatial Viewer</span></span>',
            "localStorage.setItem('spatialviewer-site-language',lang)": "localStorage.setItem('spatialviewer-site-language',lang);document.title=lang==='zh'?'图览 · Spatial Viewer':lang==='ja'?'図覧 · Spatial Viewer':'Spatial Viewer'",
            "document.getElementById('release-version').textContent=`Spatial Viewer ${version}`;": "document.getElementById('release-version').textContent=version;"
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected homepage fragment: {old[:100]}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8', newline='\n')
          PY
          git rm .github/workflows/homepage-icon-localized-name.yml
          git add docs/index.html docs/assets/app-icon.png
          git diff --cached --check
      - name: Commit homepage update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: add product icon and localized homepage names'
          git push origin HEAD:codex/homepage-icon-localized-name
