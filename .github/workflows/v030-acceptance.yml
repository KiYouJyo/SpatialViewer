name: SpatialViewer v0.3.0 Signed Acceptance

on:
  push:
    branches: ['codex/v0.3-projects-favorites']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spatialviewer-v030-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: windows-2025-vs2026
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify trilingual localization contract
        shell: pwsh
        run: ./packaging/Test-LocalizationCompleteness.ps1

      - name: Verify v0.3 product contract
        shell: pwsh
        run: |
          $project = Get-Content src/SpatialViewer.App/SpatialViewer.App.csproj -Raw
          $manifest = Get-Content src/SpatialViewer.App/Package.appxmanifest -Raw
          $release = Get-Content release/release.json -Raw
          $shell = Get-Content src/SpatialViewer.App/MainWindow.xaml -Raw
          $libraryShell = Get-Content src/SpatialViewer.App/MainWindow.Library.cs -Raw
          $projects = Get-Content src/SpatialViewer.App/Views/ProjectsView.xaml -Raw
          $favorites = Get-Content src/SpatialViewer.App/Views/FavoritesView.xaml -Raw
          $about = Get-Content src/SpatialViewer.App/Views/AboutView.xaml -Raw
          foreach ($required in @('<Version>0.3.0</Version>', '<AssemblyVersion>0.3.0.0</AssemblyVersion>', '<FileVersion>0.3.0.0</FileVersion>', '<InformationalVersion>0.3.0</InformationalVersion>')) {
            if (-not $project.Contains($required)) { throw "v0.3 project metadata missing: $required" }
          }
          if (-not $manifest.Contains('Version="0.3.0.0"')) { throw 'MSIX manifest is not 0.3.0.0.' }
          if (-not $release.Contains('"version": "0.3.0"') -or -not $release.Contains('"packageVersion": "0.3.0.0"')) { throw 'Release metadata is not v0.3.0.' }
          if (-not $shell.Contains('ItemInvoked="ShellNavigation_V03ItemInvoked"')) { throw 'v0.3 navigation handler is not connected.' }
          foreach ($required in @('ShowProjects()', 'ShowFavorites()', 'ImportFolderAsProjectAsync()', 'AppLibraryStore')) {
            if (-not $libraryShell.Contains($required)) { throw "v0.3 library shell contract missing: $required" }
          }
          if (-not $projects.Contains('ProjectsView') -or -not $favorites.Contains('FavoritesView')) { throw 'Projects/Favorites page contract missing.' }
          if ($about.Contains('Preview')) { throw 'About page still contains Preview product-channel branding.' }
          Write-Host 'v0.3 product contract PASS.'

      - name: Verify extracted kernel checkout
        shell: pwsh
        run: |
          $expected = git ls-tree HEAD external/SpatialViewer.CadCore | ForEach-Object { ($_ -split '\s+')[2] }
          $actual = git -C external/SpatialViewer.CadCore rev-parse HEAD
          if ([string]::IsNullOrWhiteSpace($expected) -or $expected -ne $actual) { throw "CadCore gitlink mismatch: expected=$expected actual=$actual" }
          if (-not (Test-Path external/SpatialViewer.CadCore/SpatialViewer.CadCore.sln)) { throw 'Extracted CadCore solution is missing.' }
          "CADCORE_SHA=$actual" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore Release x64
        run: dotnet restore SpatialViewer.sln -p:Configuration=Release -p:Platform=x64

      - name: Build Debug x64
        run: dotnet build SpatialViewer.sln -c Debug -p:Platform=x64 --no-restore

      - name: Build Release x64
        run: dotnet build SpatialViewer.sln -c Release -p:Platform=x64 --no-restore

      - name: Test Release x64
        run: dotnet test SpatialViewer.sln -c Release -p:Platform=x64 --no-build --verbosity normal

      - name: DebugHost startup smoke
        shell: pwsh
        run: |
          $exe = Get-ChildItem src/SpatialViewer.DebugHost/bin -Recurse -Filter SpatialViewer.DebugHost.exe | Where-Object FullName -match '\\Release\\' | Select-Object -First 1
          if (-not $exe) { throw 'Release DebugHost executable was not found.' }
          $process = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) { throw "DebugHost exited during smoke test with code $($process.ExitCode)." }
          Stop-Process -Id $process.Id -Force

      - name: Build and rewrite unsigned 0.3.0 x64 MSIX bundle
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'SpatialViewer-v0.3.0-AppPackages'
          dotnet build src/SpatialViewer.App/SpatialViewer.App.csproj -c Release -p:Platform=x64 -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false -p:AppxBundle=Always -p:AppxBundlePlatforms=x64 -p:UapAppxPackageBuildMode=SideloadOnly -p:AppxPackageDir="$output\"
          if ($LASTEXITCODE -ne 0) { throw "MSIX build failed: $LASTEXITCODE" }
          $bundle = @(Get-ChildItem $output -Recurse -Filter '*.msixbundle') | Select-Object -First 1
          if (-not $bundle) { throw 'MSIXBundle was not produced.' }
          $assets = Join-Path $env:RUNNER_TEMP 'SpatialViewer-v0.3.0-Acceptance'
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          $finalBundle = Join-Path $assets 'SpatialViewer_0.3.0.0_x64.msixbundle'
          Copy-Item -LiteralPath $bundle.FullName -Destination $finalBundle -Force
          ./packaging/Rewrite-CadCoreMsixBundleLayout.ps1 -BundlePath $finalBundle -BundledVersion '0.3.0'
          if ($LASTEXITCODE -ne 0) { throw "Cad Core MSIX layout rewrite failed: $LASTEXITCODE" }
          "BUNDLE_PATH=$finalBundle" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ASSETS_DIRECTORY=$assets" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify MSIX identity and CadCore resolver layout
        shell: pwsh
        run: |
          $makeappx = Get-ChildItem (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin') -Recurse -Filter makeappx.exe | Where-Object FullName -match '\\x64\\makeappx.exe$' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { throw 'x64 makeappx.exe was not found.' }
          $unbundle = Join-Path $env:RUNNER_TEMP 'SpatialViewer-v030-unbundle'
          $unpack = Join-Path $env:RUNNER_TEMP 'SpatialViewer-v030-unpack'
          Remove-Item $unbundle, $unpack -Recurse -Force -ErrorAction SilentlyContinue
          & $makeappx.FullName unbundle /p $env:BUNDLE_PATH /d $unbundle /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx unbundle failed: $LASTEXITCODE" }
          [xml]$bundleManifest = Get-Content (Join-Path $unbundle 'AppxMetadata\AppxBundleManifest.xml') -Raw
          $bundleIdentity = $bundleManifest.SelectSingleNode("/*[local-name()='Bundle']/*[local-name()='Identity']")
          if ([string]$bundleIdentity.Version -ne '0.3.0.0') { throw "Unexpected outer bundle version: $($bundleIdentity.Version)" }
          $inner = Get-ChildItem $unbundle -Recurse -Filter '*.msix' | Select-Object -First 1
          if (-not $inner) { throw 'Inner x64 MSIX was not found.' }
          & $makeappx.FullName unpack /p $inner.FullName /d $unpack /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx unpack failed: $LASTEXITCODE" }
          [xml]$packageManifest = Get-Content (Join-Path $unpack 'AppxManifest.xml') -Raw
          $packageIdentity = $packageManifest.SelectSingleNode("/*[local-name()='Package']/*[local-name()='Identity']")
          if ([string]$packageIdentity.Version -ne '0.3.0.0') { throw "Unexpected inner package version: $($packageIdentity.Version)" }
          foreach ($name in @('SpatialViewer.Core.dll','SpatialViewer.Rendering.dll','SpatialViewer.Rendering.Windows.dll','SpatialViewer.Formats.Cad.dll','SpatialViewer.Formats.Cad.ACadSharp.dll')) {
            if (Test-Path -LiteralPath (Join-Path $unpack $name) -PathType Leaf) { throw "Cad Core resolver isolation failed; root copy still packaged: $name" }
            $bundledCopy = Join-Path $unpack "Kernels\Bundled\0.3.0\$name"
            if (-not (Test-Path -LiteralPath $bundledCopy -PathType Leaf)) { throw "Bundled Cad Core fallback missing from MSIX: $bundledCopy" }
          }
          Write-Host 'MSIX layout PASS: v0.3.0.0 outer/inner identities and isolated bundled CadCore 0.3.0.'

      - name: Sign bundle and export public certificate
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.GH_RELEASE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.GH_RELEASE_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:CERTIFICATE_PASSWORD)) { throw 'GitHub release signing secrets are not configured.' }
          $pfx = Join-Path $env:RUNNER_TEMP 'spatialviewer-v030-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if ($certificate.Subject -cne 'CN=AppPublisher' -or -not $certificate.HasPrivateKey) { throw "Unexpected release certificate: $($certificate.Subject)" }
          $cer = Join-Path $env:ASSETS_DIRECTORY 'SpatialViewer-v0.3.0.cer'
          Export-Certificate -Cert $certificate -FilePath $cer | Out-Null
          $signtool = Get-ChildItem (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin') -Recurse -Filter signtool.exe | Where-Object FullName -match '\\x64\\signtool.exe$' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'x64 signtool.exe was not found.' }
          & $signtool.FullName sign /fd SHA256 /sha1 $certificate.Thumbprint /tr http://timestamp.digicert.com /td SHA256 $env:BUNDLE_PATH
          if ($LASTEXITCODE -ne 0) { throw "signtool failed: $LASTEXITCODE" }
          $signature = Get-AuthenticodeSignature -FilePath $env:BUNDLE_PATH
          if (-not $signature.SignerCertificate -or $signature.SignerCertificate.Subject -cne 'CN=AppPublisher' -or $signature.SignerCertificate.Thumbprint -cne $certificate.Thumbprint) { throw 'Signed bundle identity mismatch.' }
          if ($signature.Status -notin @('Valid', 'UnknownError')) { throw "Unexpected Authenticode status: $($signature.Status)" }
          "CERTIFICATE_PATH=$cer" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create offline 0.3.0 acceptance package
        shell: pwsh
        run: |
          $zip = ./packaging/New-CadCoreAcceptancePackage.ps1 -SignedBundlePath $env:BUNDLE_PATH -PublicCertificatePath $env:CERTIFICATE_PATH -OutputDirectory $env:ASSETS_DIRECTORY -DisplayVersion '0.3.0' -PackageVersion '0.3.0.0' -SpatialViewerCommit $env:GITHUB_SHA -CadCoreCommit $env:CADCORE_SHA | Select-Object -Last 1
          if ([string]::IsNullOrWhiteSpace([string]$zip) -or -not (Test-Path -LiteralPath $zip -PathType Leaf)) { throw "Acceptance ZIP was not produced: $zip" }
          "ACCEPTANCE_ZIP=$zip" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Write acceptance manifest
        shell: pwsh
        run: |
          $lines = foreach ($file in @($env:BUNDLE_PATH, $env:ACCEPTANCE_ZIP)) { "{0}  {1}" -f (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant(), (Split-Path -Leaf $file) }
          Set-Content -LiteralPath (Join-Path $env:ASSETS_DIRECTORY 'SHA256SUMS.txt') -Value $lines -Encoding ascii
          @(
            'SpatialViewer v0.3.0 signed acceptance',
            "SpatialViewer commit: $env:GITHUB_SHA",
            "Bundled CadCore commit: $env:CADCORE_SHA",
            'Package version: 0.3.0.0',
            'Configuration: Release x64',
            'Projects/Favorites persistence and navigation contract: PASS',
            'Trilingual localization contract: PASS',
            'Debug build: PASS',
            'Release build: PASS',
            'Tests: PASS',
            'DebugHost startup smoke: PASS',
            'MSIX v0.3.0.0 identity and resolver-isolated bundled Cad Core layout: PASS',
            'Authenticode signing (CN=AppPublisher): PASS',
            'Offline acceptance ZIP validation: PASS'
          ) | Set-Content -LiteralPath (Join-Path $env:ASSETS_DIRECTORY 'ACCEPTANCE.txt') -Encoding utf8

      - name: Upload signed acceptance package
        uses: actions/upload-artifact@v4
        with:
          name: SpatialViewer-0.3.0-signed-x64
          path: |
            ${{ env.ASSETS_DIRECTORY }}/*.zip
            ${{ env.ASSETS_DIRECTORY }}/*.msixbundle
            ${{ env.ASSETS_DIRECTORY }}/*.cer
            ${{ env.ASSETS_DIRECTORY }}/SHA256SUMS.txt
            ${{ env.ASSETS_DIRECTORY }}/ACCEPTANCE.txt
          if-no-files-found: error
          retention-days: 14
