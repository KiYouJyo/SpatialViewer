name: SpatialViewer v0.3.1 Host Contract Acceptance

on:
  push:
    branches: ['codex/v0.3.1-host-contract-acceptance']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spatialviewer-v031-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify trilingual localization contract
        shell: pwsh
        run: ./packaging/Test-LocalizationCompleteness.ps1

      - name: Verify v0.3.1 product and host contract
        shell: pwsh
        run: |
          $project = Get-Content src/SpatialViewer.App/SpatialViewer.App.csproj -Raw
          $manifest = Get-Content src/SpatialViewer.App/Package.appxmanifest -Raw
          $release = Get-Content release/release.json -Raw
          $kernelPolicy = Get-Content release/kernel-integration.json -Raw
          $bootstrapper = Get-Content src/SpatialViewer.App/CadCoreRuntimeBootstrapper.cs -Raw
          $updater = Get-Content src/SpatialViewer.App/CadCoreUpdateService.cs -Raw
          foreach ($required in @('<Version>0.3.1</Version>', '<AssemblyVersion>0.3.1.0</AssemblyVersion>', '<FileVersion>0.3.1.0</FileVersion>', '<InformationalVersion>0.3.1</InformationalVersion>')) {
            if (-not $project.Contains($required)) { throw "v0.3.1 project metadata missing: $required" }
          }
          if (-not $manifest.Contains('Version="0.3.1.0"')) { throw 'MSIX manifest is not 0.3.1.0.' }
          if (-not $release.Contains('"version": "0.3.1"') -or -not $release.Contains('"packageVersion": "0.3.1.0"')) { throw 'Release metadata is not v0.3.1.' }
          if (-not $kernelPolicy.Contains('"schemaVersion": 2') -or -not $kernelPolicy.Contains('SpatialViewer.CadHost') -or -not $kernelPolicy.Contains('"version": "1.0.0"')) { throw 'Kernel host contract policy is incomplete.' }
          if ($kernelPolicy -match 'SpatialViewer\s+0\.\d+\.x') { throw 'Kernel compatibility is still coupled to a SpatialViewer product minor version.' }
          if (-not $bootstrapper.Contains('HostContractName = "SpatialViewer.CadHost"') -or -not $bootstrapper.Contains('HostContractVersion = new(1, 0, 0)')) { throw 'Runtime host contract constants are missing.' }
          if (-not $updater.Contains('FindManifestAsset') -or -not $updater.Contains('IncompatibleHostContract') -or -not $updater.Contains('IncompatibleAbi')) { throw 'Updater preflight contract is incomplete.' }
          Write-Host 'v0.3.1 product + ABI/Host Contract contract PASS.'

      - name: Verify extracted kernel checkout
        shell: pwsh
        run: |
          $expected = git ls-tree HEAD external/SpatialViewer.CadCore | ForEach-Object { ($_ -split '\s+')[2] }
          $actual = git -C external/SpatialViewer.CadCore rev-parse HEAD
          if ([string]::IsNullOrWhiteSpace($expected) -or $expected -ne $actual) { throw "CadCore gitlink mismatch: expected=$expected actual=$actual" }
          [xml]$props = Get-Content external/SpatialViewer.CadCore/Directory.Build.props
          if ([string]$props.Project.PropertyGroup.Version -cne '0.9.0') { throw "SpatialViewer v0.3.1 must pin CadCore v0.9.0; found $($props.Project.PropertyGroup.Version)" }
          if ([string]$props.Project.PropertyGroup.AbiVersion -cne '1.0.0.0') { throw 'Pinned CadCore ABI is not 1.0.0.0.' }
          if ([string]$props.Project.PropertyGroup.HostContractName -cne 'SpatialViewer.CadHost') { throw 'Pinned CadCore host contract name mismatch.' }
          "CADCORE_SHA=$actual" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify online CadCore release manifest contract
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./packaging/Test-CadCoreUpdateRelease.ps1

      - name: Verify v0.8 to v0.9 runtime activation
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./packaging/Test-CadCoreUpdaterRuntime.ps1

      - name: Resolve latest integrated CadCore
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $payload = Join-Path $env:RUNNER_TEMP 'SpatialViewer-v031-CadCore'
          $resolved = @(./packaging/Resolve-LatestIntegratedCadCore.ps1 -OutputDirectory $payload) | Select-Object -Last 1
          if (-not $resolved -or [string]$resolved.version -cne '0.9.0') { throw "Expected CadCore v0.9.0, resolved $($resolved.version)" }
          if ([string]$resolved.abiVersion -cne '1.0.0.0' -or [string]$resolved.hostContractName -cne 'SpatialViewer.CadHost' -or [string]$resolved.hostVersion -cne '1.0.0') { throw 'Resolved CadCore ABI/Host Contract mismatch.' }
          "CADCORE_PAYLOAD=$payload" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CADCORE_VERSION=$($resolved.version)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CADCORE_ABI=$($resolved.abiVersion)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CADCORE_RELEASE_COMMIT=$($resolved.commit)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore Release x64
        run: dotnet restore SpatialViewer.sln -p:Configuration=Release -p:Platform=x64

      - name: Build Debug x64
        run: dotnet build SpatialViewer.sln -c Debug -p:Platform=x64 --no-restore

      - name: Build Release x64
        run: dotnet build SpatialViewer.sln -c Release -p:Platform=x64 --no-restore

      - name: Test Release x64
        run: dotnet test SpatialViewer.sln -c Release -p:Platform=x64 --no-build --verbosity normal

      - name: DebugHost startup smoke
        shell: pwsh
        run: |
          $exe = Get-ChildItem src/SpatialViewer.DebugHost/bin -Recurse -Filter SpatialViewer.DebugHost.exe | Where-Object FullName -match '\\Release\\' | Select-Object -First 1
          if (-not $exe) { throw 'Release DebugHost executable was not found.' }
          $process = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) { throw "DebugHost exited during smoke test with code $($process.ExitCode)." }
          Stop-Process -Id $process.Id -Force

      - name: Build and rewrite unsigned 0.3.1 x64 MSIX bundle
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'SpatialViewer-v0.3.1-AppPackages'
          dotnet build src/SpatialViewer.App/SpatialViewer.App.csproj -c Release -p:Platform=x64 -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false -p:AppxBundle=Always -p:AppxBundlePlatforms=x64 -p:UapAppxPackageBuildMode=SideloadOnly -p:AppxPackageDir="$output\"
          if ($LASTEXITCODE -ne 0) { throw "MSIX build failed: $LASTEXITCODE" }
          $bundle = @(Get-ChildItem $output -Recurse -Filter '*.msixbundle') | Select-Object -First 1
          if (-not $bundle) { throw 'MSIXBundle was not produced.' }
          $assets = Join-Path $env:RUNNER_TEMP 'SpatialViewer-v0.3.1-Acceptance'
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          $finalBundle = Join-Path $assets 'SpatialViewer_0.3.1.0_x64.msixbundle'
          Copy-Item -LiteralPath $bundle.FullName -Destination $finalBundle -Force
          ./packaging/Rewrite-CadCoreMsixBundleLayout.ps1 -BundlePath $finalBundle -BundledVersion $env:CADCORE_VERSION -PayloadDirectory $env:CADCORE_PAYLOAD
          if ($LASTEXITCODE -ne 0) { throw "CadCore MSIX layout rewrite failed: $LASTEXITCODE" }
          "BUNDLE_PATH=$finalBundle" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ASSETS_DIRECTORY=$assets" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify MSIX identity and CadCore resolver layout
        shell: pwsh
        run: |
          $makeappx = Get-ChildItem (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin') -Recurse -Filter makeappx.exe | Where-Object FullName -match '\\x64\\makeappx.exe$' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { throw 'x64 makeappx.exe was not found.' }
          $unbundle = Join-Path $env:RUNNER_TEMP 'SpatialViewer-v031-unbundle'
          $unpack = Join-Path $env:RUNNER_TEMP 'SpatialViewer-v031-unpack'
          Remove-Item $unbundle, $unpack -Recurse -Force -ErrorAction SilentlyContinue
          & $makeappx.FullName unbundle /p $env:BUNDLE_PATH /d $unbundle /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx unbundle failed: $LASTEXITCODE" }
          [xml]$bundleManifest = Get-Content (Join-Path $unbundle 'AppxMetadata\AppxBundleManifest.xml') -Raw
          $bundleIdentity = $bundleManifest.SelectSingleNode("/*[local-name()='Bundle']/*[local-name()='Identity']")
          if ([string]$bundleIdentity.Version -ne '0.3.1.0') { throw "Unexpected outer bundle version: $($bundleIdentity.Version)" }
          $inner = Get-ChildItem $unbundle -Recurse -Filter '*.msix' | Select-Object -First 1
          if (-not $inner) { throw 'Inner x64 MSIX was not found.' }
          & $makeappx.FullName unpack /p $inner.FullName /d $unpack /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx unpack failed: $LASTEXITCODE" }
          [xml]$packageManifest = Get-Content (Join-Path $unpack 'AppxManifest.xml') -Raw
          $packageIdentity = $packageManifest.SelectSingleNode("/*[local-name()='Package']/*[local-name()='Identity']")
          if ([string]$packageIdentity.Version -ne '0.3.1.0') { throw "Unexpected inner package version: $($packageIdentity.Version)" }
          foreach ($name in @('SpatialViewer.Core.dll','SpatialViewer.Rendering.dll','SpatialViewer.Rendering.Windows.dll','SpatialViewer.Formats.Cad.dll','SpatialViewer.Formats.Cad.ACadSharp.dll')) {
            if (Test-Path -LiteralPath (Join-Path $unpack $name) -PathType Leaf) { throw "CadCore resolver isolation failed; root copy still packaged: $name" }
            $source = Join-Path $env:CADCORE_PAYLOAD $name
            $bundledCopy = Join-Path $unpack "Kernels\Bundled\$env:CADCORE_VERSION\$name"
            if (-not (Test-Path -LiteralPath $bundledCopy -PathType Leaf)) { throw "Bundled CadCore missing from MSIX: $bundledCopy" }
            if ((Get-FileHash $source -Algorithm SHA256).Hash -cne (Get-FileHash $bundledCopy -Algorithm SHA256).Hash) { throw "Bundled CadCore differs from official v$env:CADCORE_VERSION release: $name" }
          }
          Write-Host "MSIX layout PASS: v0.3.1.0 identity + official CadCore v$env:CADCORE_VERSION ABI $env:CADCORE_ABI."

      - name: Sign bundle and export public certificate
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.GH_RELEASE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.GH_RELEASE_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:CERTIFICATE_PASSWORD)) { throw 'GitHub release signing secrets are not configured.' }
          $pfx = Join-Path $env:RUNNER_TEMP 'spatialviewer-v031-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if ($certificate.Subject -cne 'CN=AppPublisher' -or -not $certificate.HasPrivateKey) { throw "Unexpected release certificate: $($certificate.Subject)" }
          $cer = Join-Path $env:ASSETS_DIRECTORY 'SpatialViewer-v0.3.1.cer'
          Export-Certificate -Cert $certificate -FilePath $cer | Out-Null
          $signtool = Get-ChildItem (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin') -Recurse -Filter signtool.exe | Where-Object FullName -match '\\x64\\signtool.exe$' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'x64 signtool.exe was not found.' }
          & $signtool.FullName sign /fd SHA256 /sha1 $certificate.Thumbprint /tr http://timestamp.digicert.com /td SHA256 $env:BUNDLE_PATH
          if ($LASTEXITCODE -ne 0) { throw "signtool failed: $LASTEXITCODE" }
          $signature = Get-AuthenticodeSignature -FilePath $env:BUNDLE_PATH
          if (-not $signature.SignerCertificate -or $signature.SignerCertificate.Subject -cne 'CN=AppPublisher' -or $signature.SignerCertificate.Thumbprint -cne $certificate.Thumbprint) { throw 'Signed bundle identity mismatch.' }
          if ($signature.Status -notin @('Valid', 'UnknownError')) { throw "Unexpected Authenticode status: $($signature.Status)" }
          "CERTIFICATE_PATH=$cer" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create offline 0.3.1 acceptance package
        shell: pwsh
        run: |
          $zip = ./packaging/New-CadCoreAcceptancePackage.ps1 -SignedBundlePath $env:BUNDLE_PATH -PublicCertificatePath $env:CERTIFICATE_PATH -OutputDirectory $env:ASSETS_DIRECTORY -DisplayVersion '0.3.1' -PackageVersion '0.3.1.0' -SpatialViewerCommit $env:GITHUB_SHA -CadCoreCommit $env:CADCORE_RELEASE_COMMIT | Select-Object -Last 1
          if ([string]::IsNullOrWhiteSpace([string]$zip) -or -not (Test-Path -LiteralPath $zip -PathType Leaf)) { throw "Acceptance ZIP was not produced: $zip" }
          "ACCEPTANCE_ZIP=$zip" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Write acceptance manifest
        shell: pwsh
        run: |
          $lines = foreach ($file in @($env:BUNDLE_PATH, $env:ACCEPTANCE_ZIP)) { "{0}  {1}" -f (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant(), (Split-Path -Leaf $file) }
          Set-Content -LiteralPath (Join-Path $env:ASSETS_DIRECTORY 'SHA256SUMS.txt') -Value $lines -Encoding ascii
          @(
            'SpatialViewer v0.3.1 host-contract acceptance',
            "SpatialViewer commit: $env:GITHUB_SHA",
            "CadCore release commit: $env:CADCORE_RELEASE_COMMIT",
            "CadCore version: $env:CADCORE_VERSION",
            "CadCore ABI: $env:CADCORE_ABI",
            'Host Contract: SpatialViewer.CadHost 1.0.0',
            'Standalone manifest preflight: PASS',
            'v0.8 -> v0.9 fresh-process activation: PASS',
            'Debug build: PASS',
            'Release build: PASS',
            'Tests: PASS',
            'DebugHost startup smoke: PASS',
            'MSIX v0.3.1.0 identity and official CadCore payload: PASS',
            'Authenticode signing (CN=AppPublisher): PASS',
            'Offline acceptance ZIP validation: PASS'
          ) | Set-Content -LiteralPath (Join-Path $env:ASSETS_DIRECTORY 'ACCEPTANCE.txt') -Encoding utf8

      - name: Upload signed acceptance package
        uses: actions/upload-artifact@v4
        with:
          name: SpatialViewer-0.3.1-signed-x64
          path: |
            ${{ env.ASSETS_DIRECTORY }}/*.zip
            ${{ env.ASSETS_DIRECTORY }}/*.msixbundle
            ${{ env.ASSETS_DIRECTORY }}/*.cer
            ${{ env.ASSETS_DIRECTORY }}/SHA256SUMS.txt
            ${{ env.ASSETS_DIRECTORY }}/ACCEPTANCE.txt
          if-no-files-found: error
          retention-days: 14
